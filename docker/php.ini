; Grenzen fuer Uploads und Speicher.
;
; Ohne diese Datei gelten PHPs Vorgaben: upload_max_filesize 2M und
; post_max_size 8M. Die Anwendung erlaubt aber 8 MB je Anhang, 4 MB je
; Eventbild und 20 MB je Kontoimport - alles darueber verwarf PHP, bevor
; Laravel die Datei ueberhaupt sah. Der Gast bekam dann "Bitte eine Datei
; waehlen", und oberhalb von post_max_size verschwand der ganze POST samt
; CSRF-Token: Antwort 419, die sich wie ein Sitzungsproblem liest.
;
; Die Kette darueber laesst mehr durch (nginx im Container 20m, der
; vorgelagerte 100M) - der Engpass sass hier.
upload_max_filesize = 20M
post_max_size = 21M

; Der Kontoimport liest die ganze Datei mit json_decode ein. 20 MB JSON werden
; als PHP-Arrays ein Vielfaches davon; mit den voreingestellten 128M lief der
; Import in den Speicherfehler statt in eine Meldung.
memory_limit = 256M
