; PHP-FPM-Pool fuer Swayy.
;
; Warum diese Datei ueberhaupt existiert: Das Live-Board haelt seine Verbindung
; (SSE) bis zu 280 Sekunden offen und belegt dabei durchgehend einen Prozess.
; Die Voreinstellung des Basis-Abbilds ist pm.max_children = 5 – fuenf offene
; Boards haetten damit die komplette Installation blockiert, inklusive der
; oeffentlichen Buchungsseiten.
;
; Faustregel fuer die Groesse: max_children ≈ verfuegbarer Arbeitsspeicher des
; Containers geteilt durch ~40 MB je Prozess. 30 passt zu ~1,5 GB. Wer weniger
; Speicher hat, setzt SWAYY_FPM_MAX_CHILDREN entsprechend niedriger.

[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = ${SWAYY_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Lange offene Board-Verbindungen sind normal – ein Prozess darf nicht deshalb
; als haengend gelten. Der Stream beendet sich nach 280 s von selbst.
request_terminate_timeout = 330

; Prozesse nach 500 Anfragen erneuern (schuetzt vor Speicherlecks in Erweiterungen)
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
