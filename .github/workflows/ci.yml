name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Der GITHUB_TOKEN bekommt in jedem Job nur Leserechte auf den Code. Der
# Docker-Job erweitert sie selbst um das Schreibrecht für die Registry.
permissions:
  contents: read

# Jede Action steht auf einem festen Commit, der Kommentar dahinter nennt die
# Version. Dependabot (github-actions) hebt Commit und Kommentar gemeinsam an.
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, zip, gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests
        run: php artisan test

  # Dieselbe Suite gegen PostgreSQL 17 mit PHP 8.4, wie auf swayy.de. Der Job
  # oben testet mit SQLite; Spaltenlängen und abgebrochene Transaktionen
  # fallen dort nicht auf. Die Zugangsdaten gelten nur für diesen Wegwerf-Dienst.
  tests-pgsql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gastrobook_test
          POSTGRES_USER: gastrobook
          POSTGRES_PASSWORD: gastrobook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gastrobook -d gastrobook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: gastrobook_test
      DB_USERNAME: gastrobook
      DB_PASSWORD: gastrobook

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: intl, zip, gd, pdo_pgsql, pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.pgsql.xml erzwingt DB_CONNECTION=pgsql; die übrigen DB_*-Werte
      # kommen aus der Umgebung dieses Jobs.
      - name: Run tests (PostgreSQL)
        run: php artisan test --configuration=phpunit.pgsql.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [tests, tests-pgsql, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ghcr.io denies the OAuth token mid-push every now and then ("failed to
      # fetch oauth token: denied"). The build itself is fine, only the upload
      # fails – and a run that is red for that reason costs a release. One
      # retry; thanks to the cache it takes about a minute.
      - name: Build and push image (Wiederholung)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
