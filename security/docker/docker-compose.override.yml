# Lokaler Test-Stack: benannte Volumes statt Host-Bind-Mounts.
#
# Auf Docker Desktop (Windows/macOS) haften die Rechte von Host-Bind-Mounts
# nicht zuverlässig (die App läuft als uid 82), darum hier benannte Volumes.
# Die nginx.conf bleibt ein Datei-Mount aus dem Repo.
#
# Zusammen mit der echten docker-compose.yml verwenden:
#   docker compose -f ../../docker-compose.yml -f docker-compose.override.yml --env-file stack.env up -d
# (siehe security/README.md – dort steht der genaue Ablauf inkl. Rechte-Fix.)

services:
  app:
    image: ${GASTROBOOK_IMAGE:-ghcr.io/brightcolor/gastrobook:latest}
    volumes:
      - storage:/var/www/html/storage
      - public:/public-export
  queue:
    image: ${GASTROBOOK_IMAGE:-ghcr.io/brightcolor/gastrobook:latest}
  scheduler:
    image: ${GASTROBOOK_IMAGE:-ghcr.io/brightcolor/gastrobook:latest}
  web:
    volumes:
      - public:/var/www/html/public:ro
  db:
    volumes:
      - pg:/var/lib/postgresql/data
  redis:
    volumes:
      - redisdata:/data

volumes:
  storage:
  public:
  pg:
  redisdata:
